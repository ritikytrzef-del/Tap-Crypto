<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Telegram Mini App</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js?56"></script>

    <script type="text/javascript" src="https://cdn.tgads.space/assets/js/adexium-widget.min.js"></script>

    <style>
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #222222);
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container { text-align: center; padding: 20px; }
        button {
            padding: 10px 20px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome, <span id="username">User</span>!</h1>
        <p>Adexium Ads integration is active.</p>
        <button id="showAdBtn">Manual Ad Show</button>
    </div>

    <script type="text/javascript">
        // 1. Initialize Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Full screen open karne ke liye

        // Display user name from Telegram
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
        }

        // 2. Adexium Setup
        document.addEventListener('DOMContentLoaded', () => {
            const adexiumWidget = new AdexiumWidget({
                wid: '46231eef-4c57-40c2-8f58-fdcdc4d0535b', 
                adFormat: 'interstitial'
            });

            // AutoMode: Ye ads ko automatically trigger karega 
            adexiumWidget.autoMode();

            // Optional: Button click par ad dikhane ke liye
            document.getElementById('showAdBtn').addEventListener('click', () => {
                adexiumWidget.show();
            });
        });
    </script>
</body>
</html>
