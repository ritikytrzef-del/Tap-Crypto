<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Watch Ads App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #0088cc;
            color: white;
            border: none;
            border-radius: 5px;
            margin: 5px;
        }
        button:hover {
            background-color: #006bb3;
        }
    </style>
    
    <script async src="https://partner.adextra.io/jt/1c7362f1b1e724e03328b0c5ca9e4bedcb7c0599.js" id="adextra-sdk"></script>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <h1>Watch Ads to Earn Rewards</h1>
    
    <button onclick="checkAdStatus()">Check Ad Status</button>
    
    <div id="1c7362f1b1e724e03328b0c5ca9e4bedcb7c0599" style="width: 100%; text-align: center;"></div>

    <script>
        // Telegram Web App Initialization
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        const adZoneId = '1c7362f1b1e724e03328b0c5ca9e4bedcb7c0599';

        function checkAdStatus() {
            // Check if the ad div has content (meaning ad loaded)
            const adDiv = document.getElementById(adZoneId);
            
            if (adDiv && adDiv.innerHTML.trim() !== "") {
                console.log("Ad is likely visible");
                alert("Ad is loaded inside the block!");
            } else {
                console.log("Ad block is empty, trying to reload...");
                // Note: Native banner scripts usually auto-load. 
                // Sometimes re-inserting the script helps if it failed.
                location.reload(); 
            }
        }
        
        // Error handling for the script
        const scriptTag = document.getElementById('adextra-sdk');
        scriptTag.onerror = function() {
            alert("Ad script failed to load. Check your internet or adblocker.");
        };
    </script>
</body>
</html>
