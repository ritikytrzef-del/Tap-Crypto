<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reward Software - Mini App</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js?56"></script>

    <script type="text/javascript" src="https://cdn.tgads.space/assets/js/adexium-widget.min.js"></script>

    <style>
        body {
            background-color: var(--tg-theme-bg-color, #1a1a1a);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 30px;
            background-color: var(--tg-theme-secondary-bg-color, #242424);
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            width: 80%;
            max-width: 400px;
        }

        h1 { font-size: 22px; margin-bottom: 10px; }
        p { font-size: 14px; opacity: 0.8; margin-bottom: 25px; }

        .ad-btn {
            padding: 15px 30px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, opacity 0.2s;
        }

        .ad-btn:active { transform: scale(0.96); }
        .ad-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        #status {
            margin-top: 15px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome, <span id="username">Guest</span>!</h1>
        <p>Watch a short video ad to support our project.</p>
        
        <button class="ad-btn" id="showAdBtn">Watch Ad</button>
        <div id="status">Ready</div>
    </div>

    <script type="text/javascript">
        // 1. Initialize Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Set username from Telegram data
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
        }

        let adexiumWidget;

        // 2. Adexium Setup
        document.addEventListener('DOMContentLoaded', () => {
            const statusDiv = document.getElementById('status');
            const adBtn = document.getElementById('showAdBtn');

            try {
                adexiumWidget = new AdexiumWidget({
                    wid: '46231eef-4c57-40c2-8f58-fdcdc4d0535b', 
                    adFormat: 'interstitial',
                    debug: false // Debug mode turned off
                });
            } catch (e) {
                console.error("Adexium failed to init", e);
                statusDiv.innerText = "Error initializing ads.";
            }

            // 3. Manual Ad Show Logic
            adBtn.addEventListener('click', () => {
                adBtn.disabled = true;
                adBtn.innerText = "Loading...";
                statusDiv.innerText = "Requesting ad...";

                adexiumWidget.show()
                .then(() => {
                    // Ad shown successfully
                    statusDiv.innerText = "Ad completed!";
                    adBtn.disabled = false;
                    adBtn.innerText = "Watch Ad Again";
                })
                .catch((err) => {
                    // Handle No Fill or Network Error
                    console.log("Ad error:", err);
                    statusDiv.innerText = "Ads not available right now.";
                    adBtn.disabled = false;
                    adBtn.innerText = "Try Again";
                    
                    // Alert for quick mobile debugging
                    // alert("Ad Error: " + JSON.stringify(err));
                });
            });
        });
    </script>
</body>
</html>
