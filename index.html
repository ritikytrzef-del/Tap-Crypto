<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adexium Test Integration</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
    <script type="text/javascript" src="https://cdn.tgads.space/assets/js/adexium-widget.min.js"></script>

    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container { text-align: center; width: 90%; }
        #button {
            padding: 15px 30px;
            background-color: #0088cc;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
        }
        #button:disabled { background-color: #444; }
        #log {
            margin-top: 20px;
            font-size: 12px;
            color: #aaa;
            background: #222;
            padding: 10px;
            border-radius: 5px;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Adexium Debug Mode</h2>
        <button id="button">Watch Ad</button>
        <div id="log">Status: Waiting for click...</div>
    </div>

    <script type="text/javascript">
        const tg = window.Telegram.WebApp;
        tg.ready();

        function updateLog(msg) {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += `<div>> ${msg}</div>`;
            console.log(msg);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const button = document.getElementById('button');

            // 1. Widget Initialization
            const adexiumAds = new AdexiumWidget({
                wid: '46231eef-4c57-40c2-8f58-fdcdc4d0535b',
                adFormat: 'interstitial',
                debug: false // Testing ke liye true rakha hai
            });

            // 2. Button Click Event
            button.onclick = () => {
                updateLog("Requesting ad...");
                button.disabled = true;
                button.innerText = "Loading...";
                
                // Requesting the ad
                adexiumAds.requestAd('interstitial');
            };

            // 3. Ad Received Event
            adexiumAds.on('adReceived', (ad) => {
                updateLog("Ad received! Displaying now...");
                adexiumAds.displayAd(ad); 
                
                // Reset button after showing
                button.disabled = false;
                button.innerText = "Watch Ad";
            });

            // 4. No Ad Found Event
            adexiumAds.on('noAdFound', () => {
                updateLog("Error: No ad found for this user/region.");
                alert("Ads Not Available right now.");
                button.disabled = false;
                button.innerText = "Try Again";
            });

            // 5. Ad Closed Event (Optional but helpful)
            adexiumAds.on('adClosed', () => {
                updateLog("Ad closed by user.");
            });

            // 6. Error Event
            adexiumAds.on('error', (err) => {
                updateLog("Ad Error: " + JSON.stringify(err));
                button.disabled = false;
                button.innerText = "Watch Ad";
            });
        });
    </script>
</body>
</html>
