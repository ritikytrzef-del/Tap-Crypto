<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdExtra Telegram App</title>

    <script async src="https://partner.adextra.io/jt/1c7362f1b1e724e03328b0c5ca9e4bedcb7c0599.js"></script>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #eef2f3;
        }
        .btn-watch {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background-color: #0088cc;
            color: white;
            border: none;
            border-radius: 50px;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.3);
        }
        .btn-watch:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h1>AdExtra Rewards</h1>

    <button class="btn-watch" onclick="showAdExtra()">Watch Ad</button>

    <div id="1c7362f1b1e724e03328b0c5ca9e4bedcb7c0599"></div>

    <script>
        // Initialize Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
        }

        // STEP 3: Logic to trigger the ad
        function showAdExtra() {
            // Hum check karte hain ki p_adextra function load hua ya nahi
            if (typeof p_adextra === "function") {
                console.log("AdExtra function found, launching ad...");
                
                // Screenshot ke logic ke mutabik ad trigger karna
                p_adextra(
                    function onSuccess() {
                        alert("Ad completed! You earned your reward.");
                        // Yahan apna point adding logic likhein
                    },
                    function onError() {
                        alert("Ad failed or was closed early.");
                    }
                );
            } else {
                console.error("Ad script not yet loaded.");
                alert("Please wait 2-3 seconds for the ad to initialize.");
            }
        }
    </script>
</body>
</html>
