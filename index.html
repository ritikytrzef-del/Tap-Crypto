<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Ad Integration</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
    
    <script type="text/javascript" src="https://cdn.tgads.space/assets/js/adexium-widget.min.js"></script>

    <script src="https://ad.gigapub.tech/script?id=4819"></script>

    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container { text-align: center; width: 90%; max-width: 400px; }
        
        .btn {
            padding: 15px;
            width: 100%;
            margin: 10px 0;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        
        /* Adexium Button Style */
        #adexiumBtn { background-color: #0088cc; color: white; }
        
        /* Gigapub Button Style */
        #gigapubBtn { background-color: #f39c12; color: white; }

        .btn:disabled { background-color: #444; opacity: 0.7; }
        
        #log {
            margin-top: 20px;
            font-size: 12px;
            color: #88ff88;
            background: #000;
            padding: 10px;
            border-radius: 8px;
            text-align: left;
            min-height: 50px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Ad Center</h2>
        
        <button id="adexiumBtn" class="btn">Watch Adexium Ad</button>
        
        <button id="gigapubBtn" class="btn">Watch Gigapub Ad</button>

        <div id="log">Status: Ready</div>
    </div>

    <script type="text/javascript">
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const logDiv = document.getElementById('log');
        function updateStatus(msg) {
            logDiv.innerText = "Status: " + msg;
            console.log(msg);
        }

        document.addEventListener('DOMContentLoaded', () => {
            
            // --- 1. ADEXIUM SETUP ---
            const adexiumAds = new AdexiumWidget({
                wid: '46231eef-4c57-40c2-8f58-fdcdc4d0535b',
                adFormat: 'interstitial',
                debug: true 
            });

            const adexiumBtn = document.getElementById('adexiumBtn');
            adexiumBtn.onclick = () => {
                updateStatus("Requesting Adexium...");
                adexiumBtn.disabled = true;
                adexiumAds.requestAd('interstitial');
            };

            adexiumAds.on('adReceived', (ad) => {
                updateStatus("Adexium Ad Received!");
                adexiumAds.displayAd(ad);
                adexiumBtn.disabled = false;
            });

            adexiumAds.on('noAdFound', () => {
                updateStatus("Adexium: No ads available.");
                alert("Adexium Ads not found.");
                adexiumBtn.disabled = false;
            });


            // --- 2. GIGAPUB SETUP ---
            const gigapubBtn = document.getElementById('gigapubBtn');
            gigapubBtn.onclick = () => {
                updateStatus("Requesting Gigapub...");
                gigapubBtn.disabled = true;

                // Gigapub global function call
                window.showGiga()
                    .then(() => {
                        updateStatus("Gigapub: Ad Reward Success!");
                        alert("Reward Earned from Gigapub!");
                        gigapubBtn.disabled = false;
                    })
                    .catch(e => {
                        updateStatus("Gigapub Error: " + e);
                        alert("Gigapub Ad failed to load.");
                        gigapubBtn.disabled = false;
                    });
            };
        });
    </script>
</body>
</html>
