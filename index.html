<script type="text/javascript">
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand(); 

    let adexiumWidget;

    document.addEventListener('DOMContentLoaded', () => {
        adexiumWidget = new AdexiumWidget({
            wid: '46231eef-4c57-40c2-8f58-fdcdc4d0535b', 
            adFormat: 'interstitial'
        });

        const watchBtn = document.getElementById('watchAdBtn');
        
        watchBtn.addEventListener('click', () => {
            // Button ko disable kar dein taaki multiple clicks na hon
            watchBtn.disabled = true;
            watchBtn.innerText = "Loading Ad...";

            // Ad show karne ki request
            adexiumWidget.show()
                .then(() => {
                    // Ad successfully dikh gaya
                    watchBtn.disabled = false;
                    watchBtn.innerText = "Watch Ad to Continue";
                })
                .catch((error) => {
                    // Agar ad fail hota hai, toh screen par error aayega
                    alert("Ad error: " + JSON.stringify(error));
                    console.error(error);
                    watchBtn.disabled = false;
                    watchBtn.innerText = "Watch Ad to Continue";
                });
        });
    });
</script>
